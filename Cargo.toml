[package]
name = "gitt_account_manager"
version = "0.1.0"
edition = "2021"
authors = ["Ata"]
description = "A powerful terminal-based tool for managing multiple Git identities with OAuth authentication and automatic SSH key management"
license = "MIT"
repository = "https://github.com/satas20/git-account-manager"
readme = "README.md"
keywords = ["git", "oauth", "ssh", "terminal", "tui"]
categories = ["command-line-utilities", "authentication", "development-tools"]

[profile.dev]
opt-level = 0
debug = true

[[bin]]
name = "git-acc-mngr"
path = "src/main.rs"

[dependencies]

# Async runtime and HTTP
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12.24", features = ["json", "rustls-tls"], default-features = false }

# Error handling
anyhow = "1"
thiserror = "1" 

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async traits helper
async-trait = "0.1"

# Open the system browser cross-platform
webbrowser = "0.6"

# small helper for url-encoding the authorize URL
urlencoding = "2"

# Load local .env files during development
dotenvy = "0.15"

# CLI and TUI
clap = { version = "4", features = ["derive"] }
ratatui = "0.20"
crossterm = "0.25"

# Encryption and secure storage for tokens
keyring = "1.1"
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.21"
hostname = "0.4.1"

