[package]
name = "gitt_account_manager"
version = "0.1.0"
edition = "2024"

[dependencies]

# Async runtime and HTTP
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12.24", features = ["json", "rustls-tls"] }

# Error handling
anyhow = "1"
thiserror = "1" 

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async traits helper
async-trait = "0.1"

# CLI and TUI
clap = { version = "4", features = ["derive"] }
ratatui = "0.20"
crossterm = "0.25"
